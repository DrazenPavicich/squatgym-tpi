<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SquatGym — UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--sg-bg:#0A0A0A;--sg-acc:#FF6B00;--sg-acc2:#FF3A00;--sg-sur:#131313;--sg-sur2:#1C1C1C;--sg-txt:#F0F0F0;--sg-mut:#9FA0A8;--sg-ok:#22C55E;--sg-err:#E8343A;--sg-warn:#F59E0B;--sg-bor:rgba(255,255,255,0.08);--sg-ff-display:'Bebas Neue',Impact,sans-serif;--sg-clip-cta:polygon(0 0,calc(100% - 7px) 0,100% 100%,7px 100%);--sg-clip-login:polygon(16% 0,100% 0,100% 100%,0 100%)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background: #0A0A0A;
  color: var(--sg-txt);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-feature-settings: 'ss01','cv11';
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 80% 60% at 30% 20%, rgba(255,107,0,.025), transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(255,255,255,.02), transparent 55%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg,  rgba(0,0,0,.22) 0 1px, transparent 1px 2px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>"),
    linear-gradient(180deg, #0E0E10 0%, #0A0A0C 50%, #08080A 100%);
  background-attachment: fixed;
}
#login-screen{min-height:100vh;display:flex;overflow:hidden;position:relative}
.login-l{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3rem 4rem;position:relative}
.login-r{width:42%;background:linear-gradient(135deg, #C23A00 0%, #FF6B00 55%, #FF8A2E 100%);clip-path:var(--sg-clip-login);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.login-r::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='104' viewBox='0 0 120 104'><g fill='none' stroke='rgba(255,255,255,0.09)' stroke-width='1.4'><polygon points='30,2 58,18 58,50 30,66 2,50 2,18'/><polygon points='90,2 118,18 118,50 90,66 62,50 62,18'/><polygon points='60,54 88,70 88,102 60,118 32,102 32,70'/></g></svg>");background-size:180px 156px;opacity:.85;mix-blend-mode:overlay}
.login-r-num{font-family:var(--sg-ff-display);font-size:22rem;color:rgba(0,0,0,.10);position:absolute;z-index:1}
.login-logo{font-family:var(--sg-ff-display);font-size:2.6rem;letter-spacing:.04em;margin-bottom:.45rem}
.login-logo span{color:var(--sg-acc)}
.login-tag{color:#C9C9CF;font-size:1rem;font-weight:400;margin-bottom:2.2rem;max-width:420px;line-height:1.5}
.login-form{max-width:400px}
.login-t{font-family:var(--sg-ff-display);font-size:1.8rem;letter-spacing:.04em;margin-bottom:1.2rem}
.role-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:.55rem;margin-top:1.5rem}
.role-btn{padding:.85rem .35rem;text-align:center;cursor:pointer;font-family:'Inter',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.008));color:#E7E7EA;transition:transform .15s ease,border-color .2s;display:flex;flex-direction:column;align-items:center;gap:.35rem}
.role-btn:hover{border-color:rgba(255,107,0,.55);color:var(--sg-acc);background:linear-gradient(180deg, rgba(255,107,0,.12), rgba(255,107,0,.04));transform:translateY(-1px)}
.role-btn .role-ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#E7E7EA}
.role-btn:hover .role-ico{border-color:rgba(255,107,0,.4);color:var(--sg-acc);background:rgba(255,107,0,.08)}
.role-btn svg{width:18px;height:18px;stroke-width:1.6}
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--sg-bor);padding:.55rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--sg-ff-display);font-size:1.5rem;letter-spacing:.04em;cursor:pointer;color:var(--sg-txt)}
.logo span{color:var(--sg-acc)}
.topbar-r{display:flex;align-items:center;gap:1rem}
.role-badge{padding:.2rem .65rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:rgba(255,107,0,.15);color:var(--sg-acc);border:1px solid rgba(255,107,0,.3)}
.user-label{font-size:.88rem;color:#C9C9CF;font-weight:400}
.btn-out{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#C9C9CF;background:none;border:1px solid rgba(255,255,255,.14);padding:.4rem .85rem;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;border-radius:6px;transition:all .2s}
.btn-out:hover{color:var(--sg-acc);border-color:var(--sg-acc)}
.app-body{display:flex;min-height:calc(100vh - 48px)}
.sidebar{width:210px;background:var(--sg-sur);border-right:1px solid var(--sg-bor);padding:1rem 0;flex-shrink:0}
.sb-section{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#8F8F96;padding:.5rem 1.2rem;margin-top:.5rem;font-weight:600}
.sb-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.2rem;width:100%;font-size:.85rem;color:#C9C9CF;background:transparent;border:0;border-left:3px solid transparent;text-align:left;cursor:pointer;transition:all .15s;font-weight:500}
.sb-item:hover,.sb-item.active{color:var(--sg-acc);border-left-color:var(--sg-acc);background:rgba(255,107,0,.05)}
.sb-item .sb-ico{font-size:1rem;width:1.2rem;text-align:center}
.main{flex:1;overflow-y:auto;max-height:calc(100vh - 48px)}
.scr{display:none;padding:1.5rem 2rem}
.scr.active{display:block}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:.75rem}
.ph-title{font-family:var(--sg-ff-display);font-size:2rem;letter-spacing:.03em;line-height:1}
.ph-title span{color:var(--sg-acc)}
.ph-sub{color:#B0B0B8;font-size:.92rem;margin-top:.25rem;font-weight:400}
.btn{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.7rem 1.3rem;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.45rem;border-radius:6px}
.btn-p{background:linear-gradient(180deg,#FF7A1A,#E65C00);color:#0A0A0A;clip-path:var(--sg-clip-cta);border-radius:0;box-shadow:0 4px 14px rgba(255,107,0,.35), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.18)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:transparent;color:var(--sg-txt);border:1px solid var(--sg-bor)}
.btn-s:hover{border-color:var(--sg-acc);color:var(--sg-acc)}
.btn-d{background:var(--sg-err);color:#fff;clip-path:var(--sg-clip-cta)}
.btn-ok{background:var(--sg-ok);color:#000;clip-path:var(--sg-clip-cta)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem}
.stat{background:var(--sg-sur);border:1px solid var(--sg-bor);border-left:3px solid var(--sg-acc);padding:1rem 1.2rem}
.stat-lbl{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sg-mut);font-weight:700}
.stat-val{font-family:var(--sg-ff-display);font-size:2.2rem;line-height:1;margin-top:.15rem}
.c-acc{color:var(--sg-acc)}.c-ok{color:var(--sg-ok)}.c-err{color:var(--sg-err)}.c-warn{color:var(--sg-warn)}
.tbl-wrap{background:var(--sg-sur);border:1px solid var(--sg-bor);margin-bottom:1rem}
.tbl-top{padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--sg-bor);gap:.6rem;flex-wrap:wrap}
.tbl-title{font-family:var(--sg-ff-display);font-size:1.1rem;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}
th{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sg-mut);padding:.6rem 1rem;text-align:left;border-bottom:1px solid var(--sg-bor);font-weight:700}
td{padding:.65rem 1rem;border-bottom:1px solid rgba(255,255,255,.03);font-size:.85rem}
tr:hover td{background:rgba(255,107,0,.03)}
.badge{padding:.18rem .55rem;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:inline-block;border-radius:3px}
.b-ok{background:rgba(34,197,94,.12);color:var(--sg-ok);border:1px solid rgba(34,197,94,.3)}
.b-err{background:rgba(232,52,58,.12);color:var(--sg-err);border:1px solid rgba(232,52,58,.3)}
.b-warn{background:rgba(245,158,11,.12);color:var(--sg-warn);border:1px solid rgba(245,158,11,.3)}
.b-mut{background:rgba(119,119,119,.12);color:var(--sg-mut);border:1px solid rgba(119,119,119,.3)}
.b-acc{background:rgba(255,107,0,.12);color:var(--sg-acc);border:1px solid rgba(255,107,0,.3)}
.ab{padding:.22rem .55rem;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;margin-left:.2rem;border-radius:4px;display:inline-flex;align-items:center;gap:.25rem}
.ab-v{background:rgba(119,119,119,.15);color:var(--sg-txt)}.ab-v:hover{background:rgba(119,119,119,.35)}
.ab-e{background:rgba(255,107,0,.12);color:var(--sg-acc)}.ab-e:hover{background:var(--sg-acc);color:#000}
.ab-d{background:rgba(232,52,58,.12);color:var(--sg-err)}.ab-d:hover{background:var(--sg-err);color:#fff}
.fsec{background:var(--sg-sur);border:1px solid var(--sg-bor);padding:1.2rem;margin-bottom:.9rem}
.fsec-t{font-family:var(--sg-ff-display);font-size:1rem;letter-spacing:.04em;margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--sg-bor);color:var(--sg-acc)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.fg{display:flex;flex-direction:column;gap:.25rem}
.fg.full{grid-column:1/-1}
label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#B8B8BF;font-weight:600}
input,select,textarea{background:var(--sg-sur2);border:1px solid rgba(255,255,255,.12);color:var(--sg-txt);padding:.6rem .85rem;font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .15s;width:100%;border-radius:8px}
input::placeholder{color:#9A9AA3;font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--sg-acc);box-shadow:0 0 0 3px rgba(255,107,0,.18)}
.factions{display:flex;gap:.65rem;justify-content:flex-end;padding-top:1rem;border-top:1px solid var(--sg-bor);margin-top:.5rem}
.srch{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.srch input,.srch select{background:var(--sg-sur2);border:1px solid var(--sg-bor);color:var(--sg-txt);padding:.5rem .75rem;font-family:'Inter',sans-serif;font-size:.82rem;outline:none}
.srch input{min-width:220px}
.alert{padding:.75rem 1rem;border-left:3px solid;margin-bottom:.9rem;font-size:.85rem;line-height:1.5}
.al-warn{background:rgba(245,158,11,.08);border-color:var(--sg-warn);color:var(--sg-warn)}
.al-err{background:rgba(232,52,58,.08);border-color:var(--sg-err);color:var(--sg-err)}
.al-ok{background:rgba(34,197,94,.08);border-color:var(--sg-ok);color:var(--sg-ok)}
.al-info{background:rgba(255,107,0,.08);border-color:var(--sg-acc);color:var(--sg-acc)}
.dr{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--sg-bor);font-size:.85rem}
.dr:last-child{border-bottom:none}
.dr-lbl{color:#9FA0A8;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.dr-val{font-weight:500}
.qa{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.005));border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:1.2rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.qa::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FF6B00,#FF8A2E);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.qa:hover{border-color:rgba(255,107,0,.5);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.qa:hover::before{transform:scaleX(1)}
.qa-ico{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--sg-acc);margin-bottom:.65rem}
.qa-ico svg{width:20px;height:20px;stroke-width:1.6}
.qa-title{font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;letter-spacing:.01em;color:#F0F0F0}
.qa-desc{font-size:.78rem;color:#B0B0B8;margin-top:.15rem}
.profile-box{background:var(--sg-sur);border:1px solid var(--sg-bor);padding:1.2rem;display:flex;gap:1rem;align-items:flex-start;margin-bottom:1rem}
.profile-avatar{width:56px;height:56px;background:linear-gradient(135deg,var(--sg-acc),var(--sg-acc2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sg-ff-display);font-size:1.6rem;color:#000;flex-shrink:0}
.profile-name{font-family:var(--sg-ff-display);font-size:1.4rem;letter-spacing:.03em;line-height:1}
.profile-sub{color:#B0B0B8;font-size:.85rem;margin-top:.3rem}
.sec-t{font-family:var(--sg-ff-display);font-size:1.1rem;letter-spacing:.04em;margin:1.2rem 0 .7rem;display:flex;align-items:center;gap:.5rem}
.sec-t::after{content:'';flex:1;height:1px;background:var(--sg-bor)}
.text-mut{color:#B0B0B8}.text-sm{font-size:.85rem}
.mt1{margin-top:.9rem}.mb1{margin-bottom:.9rem}
.flex{display:flex}.gap1{gap:.9rem}
.flex-col{display:flex;flex-direction:column}
.justify-between{justify-content:space-between}
.items-center{align-items:center}
.confirm-box{background:var(--sg-sur);border:1px solid var(--sg-bor);border-top:3px solid var(--sg-err);padding:1.5rem;max-width:480px;margin:2rem auto}
.confirm-title{font-family:var(--sg-ff-display);font-size:1.4rem;letter-spacing:.04em;color:var(--sg-err);margin-bottom:.8rem}
.cron-slot{background:rgba(255,107,0,.08);border:1px solid rgba(255,107,0,.25);padding:.35rem .5rem;font-size:.75rem;border-radius:4px;cursor:pointer;transition:all .15s}
.cron-slot:hover{background:rgba(255,107,0,.15);border-color:var(--sg-acc)}
.wizard-steps { display:flex; gap:1rem; margin-bottom:2rem; position:relative; }
.wizard-steps::before { content:''; position:absolute; top:50%; left:0; right:0; height:2px; background:var(--sg-bor); z-index:0; }
.step { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.5rem; position:relative; z-index:1; }
.step-num { width:32px; height:32px; border-radius:50%; background:var(--sg-sur2); border:2px solid var(--sg-bor); display:flex; align-items:center; justify-content:center; font-weight:bold; transition:all 0.3s; }
.step.active .step-num { background:var(--sg-acc); border-color:var(--sg-acc); color:#000; box-shadow:0 0 15px rgba(255,107,0,0.4); }
.step.done .step-num { background:var(--sg-ok); border-color:var(--sg-ok); color:#000; }
.step-lbl { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--sg-mut); font-weight:600; transition:all 0.3s; }
.step.active .step-lbl { color:var(--sg-acc); }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1.5rem; }
.class-card { background:var(--sg-sur); border:1px solid var(--sg-bor); border-radius:12px; padding:1.5rem; transition:all 0.3s; position:relative; overflow:hidden; }
.class-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--sg-acc); }
.class-card:hover { transform:translateY(-4px); border-color:rgba(255,107,0,0.4); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
.cc-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
.cc-title { font-family:var(--sg-ff-display); font-size:1.6rem; line-height:1; }
.cc-prof { color:var(--sg-mut); font-size:0.85rem; margin-top:0.2rem; }
.cc-info { display:flex; gap:1rem; font-size:0.85rem; margin-bottom:1rem; }
.cc-info-item { display:flex; align-items:center; gap:0.3rem; color:#C9C9CF; }
.cc-bot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--sg-bor); padding-top:1rem; margin-top:1rem; }
.avatar-sm { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--sg-acc),var(--sg-acc2)); display:flex; align-items:center; justify-content:center; font-family:var(--sg-ff-display); font-size:1.2rem; color:#000; flex-shrink:0; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.animate-fade { animation: fadeIn 0.4s ease forwards; }
.matrix-wrap { width: 100%; overflow-x: auto; background: var(--sg-sur); border: 1px solid var(--sg-bor); border-radius: 8px; }
.matrix-table { width: 100%; min-width: 800px; border-collapse: collapse; }
.matrix-table th { background: var(--sg-sur2); border: 1px solid var(--sg-bor); text-align: center; padding: 1rem; color: var(--sg-txt); font-family: var(--sg-ff-display); font-size: 1.1rem; letter-spacing: 0.04em; width: 16%; }
.matrix-table th:first-child { width: 10%; color: var(--sg-mut); }
.matrix-table td { border: 1px solid var(--sg-bor); padding: 0.5rem; vertical-align: top; height: 120px; }
.matrix-table td.time-col { background: var(--sg-sur2); font-weight: 700; color: var(--sg-mut); text-align: center; vertical-align: middle; }
.matrix-cell-clase { background: rgba(255,107,0,.08); border-left: 3px solid var(--sg-acc); padding: 0.6rem; border-radius: 4px; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; }
.matrix-cell-clase:hover { background: rgba(255,107,0,.15); transform: translateY(-2px); }
.matrix-cell-t { font-weight: 700; color: #fff; margin-bottom: 0.2rem; display: block; font-size: 0.85rem; }
.matrix-cell-p { color: var(--sg-mut); font-size: 0.75rem; }
button,.btn,.btn-out,.ab,.role-btn,.qa,.sb-item{min-height:36px}
button:focus-visible,.btn:focus-visible,.btn-out:focus-visible,.ab:focus-visible,.role-btn:focus-visible,.qa:focus-visible,.sb-item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sg-acc);outline-offset:2px}
.qa,.role-btn,.sb-item{cursor:pointer}
.toast-region{position:fixed;right:1.25rem;bottom:1.25rem;z-index:300;display:flex;flex-direction:column;gap:.6rem;max-width:min(380px,calc(100vw - 2rem))}
.toast{background:var(--sg-sur2);border:1px solid var(--sg-bor);border-left:3px solid var(--sg-acc);box-shadow:var(--sg-shadow-md);padding:.8rem 1rem;color:var(--sg-txt);font-size:.85rem;line-height:1.4;animation:fadeIn .2s ease}
.toast.ok{border-left-color:var(--sg-ok)}.toast.err{border-left-color:var(--sg-err)}.toast.warn{border-left-color:var(--sg-warn)}
.print-only{display:none}
@media (max-width:900px){
  .login-l{padding:2rem}.login-r{width:35%}.sidebar{width:180px}.scr{padding:1.25rem}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
  .quick-actions,.card-grid{grid-template-columns:repeat(2,1fr)!important}
}
@media (max-width:680px){
  .login-r{display:none}.login-l{padding:1.5rem;align-items:center}.login-form{width:min(100%,400px)}
  .topbar{padding:.55rem .8rem;gap:.5rem}.topbar-r{gap:.45rem}.user-label{display:none}.role-badge{font-size:.58rem}
  .app-body{display:block}.sidebar{width:100%;display:flex;overflow-x:auto;padding:.35rem;border-right:0;border-bottom:1px solid var(--sg-bor);gap:.25rem}
  .sb-section{display:none}.sb-item{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:.55rem .7rem;font-size:.78rem}.sb-item.active{border-left:0;border-bottom-color:var(--sg-acc)}

const downloadCSV = (filename, rows) => {
  const csv = rows.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename; link.click();
  URL.revokeObjectURL(url);
  notify('Archivo exportado correctamente', 'ok');
};

function AlumnosScreen({ role, onNav, onSelect, filtroInicial }){
  const [q, setQ] = useState('');
  const [estado, setEstado] = useState(filtroInicial?.estado || '');
  const [sede, setSede] = useState('');
  const [desde, setDesde] = useState('');
  const [hasta, setHasta] = useState('');
  React.useEffect(()=>{ if (filtroInicial?.estado) setEstado(filtroInicial.estado); }, [filtroInicial]);
  // Permisos: Admin puede todo (Altas, Bajas, Modificaciones). Secretaria puede Altas y Modificaciones menores. (3.1.1 vs 3.1.11)
  const puedeCrear = role === 'admin' || role === 'secretaria';
  const puedeEditar = role === 'admin' || role === 'secretaria';
  const puedeBorrar = role === 'admin';
  const filtered = ALUMNOS.filter(a => {
    if (estado && a.estado !== estado) return false;
    if (sede && a.sede !== sede) return false;
    if (desde && a.vto < desde) return false;
    if (hasta && a.vto > hasta) return false;
    if (q) {
      const s = (a.ap + ' ' + a.no + ' ' + a.dni + ' ' + a.plan).toLowerCase();
      return s.includes(q.toLowerCase());
    }
    return true;
  });
  const limpiar = () => { setQ(''); setEstado(''); setSede(''); setDesde(''); setHasta(''); };
  return (
    <div className="scr active">
      <PageHeader title={puedeCrear ? 'GESTIÓN DE' : 'CONSULTA DE'} accent="ALUMNOS" sub={puedeCrear ? 'Buscá, filtrá y gestioná el padrón' : 'Vista de solo consulta — Sede Centro'}>
        {puedeCrear && <Btn variant="p" onClick={()=>onNav('form-alumno')}>+ Nuevo Alumno</Btn>}
      </PageHeader>
      <div className="tbl-wrap">
        <div className="tbl-top">
          <div className="srch">
            <input type="text" placeholder="Buscar nombre, DNI, plan..." value={q} onChange={e=>setQ(e.target.value)}/>
            <select value={estado} onChange={e=>setEstado(e.target.value)}>
              <option value="">Todos los estados</option>
              <option>Habilitada</option><option>Deudor</option><option>Inactivo</option>
            </select>
            <select value={sede} onChange={e=>setSede(e.target.value)}>
              <option value="">Todas las sedes</option>
              <option>Centro</option><option>Norte</option>
            </select>
            <label style={{display:'flex',alignItems:'center',gap:'.3rem',fontSize:'.7rem'}}>Vto. desde <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{width:'auto'}}/></label>
            <label style={{display:'flex',alignItems:'center',gap:'.3rem',fontSize:'.7rem'}}>hasta <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{width:'auto'}}/></label>
            <button className="btn-out" onClick={limpiar}>Limpiar</button>
          </div>
        </div>
        <table>
          <thead><tr><th>#</th><th>Alumno</th><th>Plan</th><th>Sede</th><th>Vto.</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            {filtered.map((a,i) => (
              <tr key={a.id}>
                <td>{String(i+1).padStart(3,'0')}</td>
                <td>
                  <div style={{display:'flex', alignItems:'center', gap:'0.8rem'}}>
                    <div className="avatar-sm">{a.no[0]}{a.ap[0]}</div>
                    <div style={{display:'flex', flexDirection:'column'}}>
                      <strong style={{color:'#FFF'}}>{a.ap}, {a.no}</strong>
                      <span style={{fontSize:'0.75rem', color:'var(--sg-mut)'}}>DNI {a.dni}</span>
                    </div>
                  </div>

function ReportesScreen(){
  const [sede, setSede] = useState('');
  const [plan, setPlan] = useState('');
  const planOptions = Array.from(new Set(ALUMNOS.map(a => a.plan)));

  const filteredAlumnos = ALUMNOS.filter(a =>
    (sede ? a.sede === sede : true) &&
    (plan ? a.plan === plan : true)
  );

  const selectedClasses = CLASES.filter(c =>
    (sede ? c.sede === sede : true) &&
    (plan ? (plan === 'Full Access' ? true : c.nombre === plan) : true)
  );

  const totalRevenue = filteredAlumnos.reduce((sum, alumno) => {
    const priceMap = {
      'Full Access': 45000,
      'Musculación': 32000,
      'Zumba': 31000,
      'Kickboxing': 33000,
      'Spinning': 30000,
      'CrossFit': 34000,
    };
    return sum + (priceMap[alumno.plan] || 30000);
  }, 0);

  const totalCapacity = selectedClasses.reduce((sum, clase) => sum + clase.capacidad, 0);
  const totalInscriptos = selectedClasses.reduce((sum, clase) => sum + clase.inscriptos, 0);
  const asistencia = selectedClasses.length ? Math.round((totalInscriptos / totalCapacity) * 100) : 0;
  const ocupacion = selectedClasses.length ? Math.round((selectedClasses.filter(c => c.inscriptos / c.capacidad >= 0.75).length / selectedClasses.length) * 100) : 0;

  const formatMoney = value => {
    if (value >= 1000000) return `$${(value / 1000000).toFixed(1)}M`;
    if (value >= 1000) return `$${(value / 1000).toFixed(0)}K`;
    return `$${value}`;
  };

  return (
    <div className="scr active">
      <PageHeader title="REPORTES Y" accent="ESTADÍSTICAS" sub="KPIs de gestión">
        <Btn variant="p" onClick={()=>downloadCSV('squatgym-reporte.csv', [['Alumno','DNI','Plan','Sede','Vencimiento','Estado'], ...filteredAlumnos.map(a=>[`${a.ap}, ${a.no}`,a.dni,a.plan,a.sede,a.vto,a.estado])])}>Exportar CSV</Btn>
        <Btn variant="s" onClick={printPage}>Imprimir</Btn>
      </PageHeader>

      <div className="srch mb1" style={{display:'flex',gap:'1rem',alignItems:'center',flexWrap:'wrap'}}>
        <select value={sede} onChange={e => setSede(e.target.value)}>
          <option value="">Todas las sedes</option>
          {Array.from(new Set(ALUMNOS.map(a => a.sede))).map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={plan} onChange={e => setPlan(e.target.value)}>
          <option value="">Todos los planes</option>
          {planOptions.map(p => <option key={p} value={p}>{p}</option>)}
        </select>
      </div>

      <div className="g3 mb1">
        <Stat label="Total recaudado" value={formatMoney(totalRevenue)} color="acc"/>
        <Stat label="Asistencia" value={`${asistencia}%`} color="ok"/>
        <Stat label="Ocupación" value={`${ocupacion}%`} color="warn"/>
      </div>
    </div>
  );
}

// Form Clase — solo Admin (3.1.17)
function FormClaseScreen({ onNav, clase }){
  const TODOS_DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const PROFES = ['Martín Acosta', 'Laura Díaz', 'Carlos Ríos', 'Sofía Nielsen'];

  const [nombre, setNombre]       = useState(clase?.nombre || '');
  const [prof,   setProf]         = useState(clase?.prof   || PROFES[0]);
  const [diasSel, setDiasSel]     = useState(clase?.dias || (clase?.dia ? [clase.dia] : []));
  const [hora,   setHora]         = useState(clase?.hora || '');
  const [fin,    setFin]          = useState(clase?.fin  || '');
  const [sala,   setSala]         = useState(clase?.sala || 'Sala 1');
  const [sede,   setSede]         = useState(clase?.sede || 'Centro');
  const [capacidad, setCapacidad] = useState(clase?.capacidad || 20);
  const [forzar, setForzar]       = useState(false);

  const toggleDia = (d) => {
    setDiasSel(prev => {
      const nuevo = prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d];
      return nuevo.sort((a,b) => TODOS_DIAS.indexOf(a) - TODOS_DIAS.indexOf(b));
    });
  };

  // Detección en vivo (CU GC-08)
  const conflictos = detectarSuperposicion(
    { nombre, prof, dias: diasSel, hora, fin, sala, sede, capacidad },
    clase?.id
  );
  const conflictosSala = conflictos.filter(c => c.tipo === 'Sala');
  const conflictosProf = conflictos.filter(c => c.tipo === 'Profesor');
  const datosCompletos = nombre && diasSel.length > 0 && hora && fin && sala;

  const guardar = () => {
    if (conflictos.length > 0 && !forzar) {
      notify('No se puede guardar: hay conflictos sin resolver. Revisá las advertencias o tildá "Forzar guardado".', 'err');
      return;
    }
    notify(conflictos.length > 0
      ? `Clase guardada con conflictos forzados — los responsables fueron notificados.`
      : 'Clase guardada correctamente');
    onNav('clases');
  };

  return (
    <div className="scr active animate-fade">
      <PageHeader title={clase ? 'EDITAR' : 'ALTA DE'} accent="CLASE" sub="Definir horarios, profesor y sala">
        <Btn variant="s" onClick={()=>onNav('clases')}>← Volver</Btn>
      </PageHeader>

      <FormSection title="Datos de la clase">
        <div className="fr">
          <FormField label="Nombre">
            <input value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Musculación"/>
          </FormField>
          <FormField label="Profesor">
            <select value={prof} onChange={e=>setProf(e.target.value)}>
              {PROFES.map(p => <option key={p}>{p}</option>)}
            </select>
          </FormField>
        </div>
        
        <div style={{marginBottom:'0.9rem'}}>
          <FormField label="Días de la semana (Selección múltiple)">
            <div style={{display:'flex', flexWrap:'wrap', gap:'0.5rem', marginTop:'0.3rem'}}>
              {TODOS_DIAS.map(d => {
                const activo = diasSel.includes(d);
                return (
                  <label key={d} style={{display:'flex', alignItems:'center', gap:'0.4rem', textTransform:'none', letterSpacing:'normal', fontSize:'0.85rem', color:activo?'var(--sg-acc)':'var(--sg-txt)', cursor:'pointer', background:'var(--sg-sur2)', padding:'0.4rem 0.7rem', borderRadius:'6px', border:activo?'1px solid var(--sg-acc)':'1px solid var(--sg-bor)', transition:'all 0.15s'}}>
                    <input type="checkbox" checked={activo} onChange={()=>toggleDia(d)} style={{width:'auto', margin:0, cursor:'pointer'}}/>
                    {d}
                  </label>
                );
              })}
            </div>
            {diasSel.length === 0 && <span style={{color:'var(--sg-err)', fontSize:'0.75rem', display:'block', marginTop:'0.4rem'}}>⚠ Debe seleccionar al menos un día para el cronograma.</span>}
          </FormField>
        </div>

        <div className="fr3">
          <FormField label="Hora inicio"><input type="time" value={hora} onChange={e=>setHora(e.target.value)}/></FormField>
          <FormField label="Hora fin"><input type="time" value={fin} onChange={e=>setFin(e.target.value)}/></FormField>
          <FormField label="Sala">
            <select value={sala} onChange={e=>setSala(e.target.value)}>
              <option>Sala 1</option><option>Sala 2</option><option>Sala 3</option>
            </select>
          </FormField>
        </div>
        <div className="fr3">
          <FormField label="Sede">
            <select value={sede} onChange={e=>setSede(e.target.value)}>
              <option>Centro</option><option>Norte</option>
            </select>
          </FormField>
          <FormField label="Capacidad"><input type="number" value={capacidad} onChange={e=>setCapacidad(Number(e.target.value)||0)}/></FormField>
        </div>
      </FormSection>

      {/* CU GC-08: Validación de superposición en tiempo real */}
      {datosCompletos && conflictos.length === 0 && (
        <Alert variant="ok">✓ Sin conflictos de horario — la clase no se superpone con sala ni profesor de otra clase existente.</Alert>
      )}

      {conflictos.length > 0 && (
        <div className="fsec" style={{borderLeft:'3px solid var(--sg-err)'}}>
          <div className="fsec-t" style={{color:'var(--sg-err)'}}>
            ⚡ Conflicto detectado — Superposición de recursos (CU GC-08)
          </div>
          <div style={{fontSize:'.85rem',color:'#C9C9CF',marginBottom:'.8rem'}}>
            La configuración actual entra en conflicto con clases ya programadas. Revisá los siguientes puntos antes de guardar:
          </div>

          {conflictosSala.length > 0 && (
            <div style={{marginBottom:'1rem'}}>
              <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--sg-warn)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:'.5rem'}}>🏢 Conflicto de sala</div>
              {conflictosSala.map((cf, i) => (
                <div key={i} className="alert al-warn" style={{marginBottom:'.4rem'}}>

            <input type="checkbox" checked={forzar} onChange={e=>setForzar(e.target.checked)} style={{width:'auto'}}/>

        </div>
      )}

      <div className="factions">
        <Btn variant="s" onClick={()=>onNav('clases')}>Cancelar</Btn>
        <button

        >

        </button>
      </div>
    </div>
  );
}

// Baja con motivo (alumno o clase)
function BajaConfirmScreen({ onNav, tipo='alumno', item }){
  const [motivo, setMotivo] = useState('');
  const label = tipo==='alumno'
    ? (item ? `${item.ap}, ${item.no}` : 'el alumno')
    : (item ? item.nombre : 'la clase');
  return (
    <div className="scr active">
      <div className="confirm-box">
        <div className="confirm-title">⚠ Confirmar baja de {tipo}</div>
        <p className="text-mut text-sm" style={{marginBottom:'1rem'}}>
          Vas a dar de baja {tipo==='alumno'?'al alumno':'la clase'} <strong>{label}</strong>. {tipo==='alumno' ? 'El alumno pasará a estado Inactivo, pero seguirá existiendo para historial, reportes y asistencias pasadas.' : 'Esta acción queda registrada en auditoría (3.1.4a).'}
        </p>
        <FormField label="Motivo de la baja">
          <textarea rows={3} value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Detalle el motivo..."/>
        </FormField>
        <div className="factions">
          <Btn variant="s" onClick={()=>onNav(tipo==='alumno'?'alumnos':'clases')}>Cancelar</Btn>
          <button className="btn btn-d" disabled={!motivo} onClick={()=>{
            if (tipo === 'alumno' && item) {
              const idx = ALUMNOS.findIndex(a => a.id === item.id);
              if (idx >= 0) ALUMNOS[idx].estado = 'Inactivo';
              notify(`El alumno ${item.ap}, ${item.no} ha sido marcado como Inactivo.`, 'ok');
            } else if (tipo === 'clase' && item) {
              const idx = CLASES.findIndex(c => c.id === item.id);
              if (idx >= 0) CLASES.splice(idx, 1);
              notify(`La clase ${item.nombre} fue eliminada del sistema.`, 'ok');
            }
            onNav(tipo==='alumno'?'alumnos':'clases');
          }}>Confirmar baja</button>
        </div>
      </div>
    </div>
  );
}

  return (

      <FormSection title="Datos del Pago">
        <div className="fr">
          <FormField label="Concepto"><input defaultValue={`Cuota ${new Date().toLocaleDateString('es-AR',{month:'long',year:'numeric'})}`}/></FormField>
          <FormField label="Fecha de pago"><input type="date" defaultValue={new Date().toISOString().slice(0,10)}/></FormField>
        </div>
        <div className="fr">
          <FormField label="Monto base ($)"><input type="number" value={monto} onChange={e=>setMonto(Number(e.target.value)||0)}/></FormField>
          <FormField label="Método de pago">
            <select value={metodo} onChange={e=>setMetodo(e.target.value)}>
              <option>Efectivo</option><option>Transferencia</option><option>QR / Mercado Pago</option><option>Débito</option><option>Crédito</option>

      <FormSection title="Aplicar Promoción / Descuento (CU GA-06)">

          <FormField label="Promoción vigente">
            <select value={promoId} onChange={e=>setPromoId(e.target.value)}>
              <option value="">— Sin promoción —</option>
              {promosActivas.map(p => (
                <option key={p.id} value={p.id}>{p.codigo} — {p.descripcion} ({p.valor}%)</option>
              ))}
            </select>
          </FormField>
          <FormField label="Vigencia">
            <input disabled value={promo ? `${promo.vigDesde} → ${promo.vigHasta}` : 'Seleccione una promoción'}/>
          </FormField>
        </div>
        {promo && (
          <Alert variant="info">🏷️ Se aplicará <strong>{promo.codigo}</strong> ({promo.valor}% de descuento) por <strong>{promo.descripcion}</strong>.</Alert>
        )}
      </FormSection>

      <div className="fsec" style={{borderLeft:'3px solid var(--sg-acc)'}}>
        <div className="fsec-t">Resumen</div>
        <div className="dr"><span className="dr-lbl">Subtotal</span><span className="dr-val">$ {monto.toLocaleString('es-AR')}</span></div>
        <div className="dr"><span className="dr-lbl">Descuento aplicado</span><span className="dr-val c-acc">– $ {descuento.toLocaleString('es-AR')}</span></div>
        <div className="dr" style={{paddingTop:'.8rem'}}>
          <span className="dr-lbl" style={{fontSize:'.9rem',color:'#FFF'}}>TOTAL A COBRAR</span>
          <span className="dr-val" style={{fontFamily:'var(--sg-ff-display)',fontSize:'1.8rem',color:'var(--sg-ok)'}}>$ {total.toLocaleString('es-AR')}</span>
        </div>
      </div>

      <div className="factions">
        <Btn variant="s" onClick={()=>onNav('pagos')}>Cancelar</Btn>
        <Btn variant="ok" onClick={()=>{ notify(`Pago registrado: $${total.toLocaleString('es-AR')} (${metodo}). Comprobante emitido.`, 'ok'); onNav('pagos'); }}>✓ Confirmar y emitir comprobante</Btn>
      </div>
    </div>
  );

// CU GC-08: Helper de detección de superposición de clases
// Se invoca desde FormClaseScreen para validar al crear/editar una clase
// Devuelve un array de conflictos: { tipo:'Sala'|'Profesor', con: clase_existente, dias:[...] }
function detectarSuperposicion(claseNueva, claseEditandoId = null){
  const conflictos = [];
  const diasNueva = claseNueva.dias || [];
  if (!claseNueva.hora || !claseNueva.fin || diasNueva.length === 0) return conflictos;

  for (const otra of CLASES) {
    if (claseEditandoId && otra.id === claseEditandoId) continue; // no comparar contra sí misma
    const diasOtra = otra.dias || [otra.dia];
    const diasComunes = diasNueva.filter(d => diasOtra.includes(d));
    if (diasComunes.length === 0) continue;
    const overlap = claseNueva.hora < otra.fin && otra.hora < claseNueva.fin;
    if (!overlap) continue;
    if (claseNueva.sala === otra.sala && claseNueva.sede === otra.sede) {
      conflictos.push({ tipo:'Sala', con: otra, dias: diasComunes, recurso: `${otra.sala} (${otra.sede})` });
    }
    if (claseNueva.prof === otra.prof) {
      conflictos.push({ tipo:'Profesor', con: otra, dias: diasComunes, recurso: otra.prof });
    }
  }
  return conflictos;
}

// CU GC-02: Verificar Disponibilidad de Turno
function DisponibilidadScreen({ onNav }){
  const [claseId, setClaseId] = useState(CLASES[0].id);
  const c = CLASES.find(x => x.id === Number(claseId));
  const libres = c.capacidad - c.inscriptos;
  const pct = Math.round(c.inscriptos / c.capacidad * 100);
  const estado = libres === 0 ? 'COMPLETO' : libres <= 3 ? 'POCAS PLAZAS' : 'DISPONIBLE';
  const color = libres === 0 ? 'err' : libres <= 3 ? 'warn' : 'ok';

  return (
    <div className="scr active animate-fade">
      <PageHeader title="DISPONIBILIDAD" accent="DE TURNO" sub="Consulta de cupos por clase — CU GC-02"/>

      <FormSection title="Seleccionar clase">
        <div className="fr">
          <FormField label="Clase">
            <select value={claseId} onChange={e=>setClaseId(e.target.value)}>
              {CLASES.map(cl => <option key={cl.id} value={cl.id}>{cl.nombre} — {cl.dias?cl.dias.join('/'):cl.dia} {cl.hora} ({cl.sede})</option>)}
            </select>
          </FormField>
          <FormField label="Sede"><input disabled value={c.sede}/></FormField>
        </div>
      </FormSection>

      <div className="g4 mb1">
        <Stat label="Capacidad" value={c.capacidad} color="acc"/>
        <Stat label="Inscriptos" value={c.inscriptos} color="warn"/>
        <Stat label="Cupos Libres" value={libres} color={color}/>
        <Stat label="Ocupación" value={`${pct}%`} color={color}/>
      </div>

      <div className="fsec" style={{borderLeft:'3px solid var(--sg-acc)'}}>
        <div className="fsec-t">Estado del turno</div>
        <div style={{display:'flex',alignItems:'center',gap:'1.5rem',padding:'1rem 0'}}>
          <div style={{fontFamily:'var(--sg-ff-display)',fontSize:'4rem',color:`var(--sg-${color==='err'?'err':color==='warn'?'warn':'ok'})`,lineHeight:1}}>
            {libres === 0 ? '✗' : '✓'}
          </div>
          <div>
            <Badge variant={color}>{estado}</Badge>
            <div style={{marginTop:'.5rem',fontSize:'.95rem'}}>
              {libres === 0 && 'No hay cupos disponibles. Sugerimos lista de espera.'}
              {libres > 0 && libres <= 3 && `Quedan ${libres} cupos. Sugerimos confirmar pronto.`}
              {libres > 3 && `Hay ${libres} cupos disponibles para inscripción inmediata.`}
            </div>
          </div>
        </div>
        {/* Barra de ocupación */}
        <div style={{height:'10px',background:'var(--sg-sur2)',borderRadius:'5px',overflow:'hidden',marginTop:'.5rem'}}>
          <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,var(--sg-${color==='err'?'err':color==='warn'?'warn':'ok'}),var(--sg-acc))`,transition:'width .3s'}}/>
        </div>
      </div>

      <div className="factions">
        <Btn variant="s" onClick={()=>onNav('clases')}>Ver Cronograma</Btn>
        <Btn variant="p" disabled={libres===0} onClick={()=>notify('Inscripción registrada para la clase.', 'ok')}>
          {libres === 0 ? 'Sin cupos' : '+ Reservar cupo'}
        </Btn>
      </div>
    </div>
  );
}

// App
function App(){
  const [role, setRole] = useState(null);
  const [perfil, setPerfil] = useState('aldia'); // 'aldia' | 'deudor' — solo aplica a rol alumno
  const [scr, setScr] = useState('dashboard');
  const [selected, setSelected] = useState(null);
  const [toasts, setToasts] = useState([]);

  React.useEffect(() => {
    const handleToast = event => {
      const id = Date.now() + Math.random();
      setToasts(current => [...current, {id, message:event.detail.message, type:event.detail.type || 'info'}]);
      window.setTimeout(() => setToasts(current => current.filter(toast => toast.id !== id)), 4200);
    };
    window.addEventListener('sg:toast', handleToast);
    return () => window.removeEventListener('sg:toast', handleToast);
  }, []);

  React.useEffect(() => {
    try { const saved = JSON.parse(localStorage.getItem('sg_state') || 'null'); if (saved) { setRole(saved.role); setPerfil(saved.perfil || 'aldia'); setScr(saved.scr || 'dashboard'); } } catch {}
  }, []);
  React.useEffect(() => {
    try { localStorage.setItem('sg_state', JSON.stringify({role, perfil, scr})); } catch {}
  }, [role, perfil, scr]);

  const [filtroAlumnos, setFiltroAlumnos] = useState(null);

  const toastRegion = <div className="toast-region" aria-live="polite">{toasts.map(toast => <div key={toast.id} className={'toast ' + toast.type}>{toast.message}</div>)}</div>;
  if (!role) return <><LoginScreen onLogin={(r, p='aldia') => { setRole(r); setPerfil(p); setScr(r === 'alumno' ? 'portal' : 'dashboard'); }} />{toastRegion}</>;

  const onNav = key => setScr(key);
  const onSelect = a => { setSelected(a); };

  const isAlumno = role === 'alumno';
  const isProf = role === 'profesor';

  // Filtros iniciales (ej: deudores desde dashboard del Encargado)
  const filtrarDeudoresYNavegar = () => { setFiltroAlumnos({ estado:'Deudor' }); setScr('alumnos'); };

  // Guardia de permisos por rol — bloquea acceso directo a pantallas no permitidas
  const PERMISOS = {
    admin:      ['dashboard','alumnos','form-alumno','ficha-alumno','baja-alumno','estado-cuenta','historial-asistencia','clases','form-clase','ficha-clase','baja-clase','pagos','registrar-pago','promociones','asistencia','asist-profes','inasistencias','reemplazos','disponibilidad','reportes','notificaciones','traza','mi-plan','decl-jurada','mi-cuenta','mis-asistencias','portal'],
    encargado:  ['dashboard','alumnos','ficha-alumno','estado-cuenta','historial-asistencia','clases','ficha-clase','asist-profes','inasistencias','reemplazos'],
    secretaria: ['dashboard','alumnos','form-alumno','ficha-alumno','estado-cuenta','historial-asistencia','clases','ficha-clase','pagos','registrar-pago','promociones','disponibilidad','asistencia','asist-profes','inasistencias','reemplazos','notificaciones'],
    profesor:   ['dashboard','clases','ficha-clase','cronograma','asistencia'],
    alumno:     ['portal','mi-plan','mi-cuenta','mis-asistencias','decl-jurada'],
  };
  const permitido = (PERMISOS[role] || []).includes(scr);

  let screen;
  if (!permitido) {
    screen = <div className="scr active"><PageHeader title="ACCESO" accent="DENEGADO" sub="Tu rol no tiene permisos para esta pantalla"/><Alert variant="err">🔒 La pantalla solicitada no está habilitada para el rol <strong>{ROLES[role].label}</strong>. Volvé al panel principal.</Alert><Btn variant="p" onClick={()=>setScr(isAlumno?'portal':'dashboard')}>← Volver al panel</Btn></div>;
  }
  else if (scr === 'dashboard') screen = <DashboardScreen role={role} perfil={perfil} onNav={onNav} onFiltrarDeudores={filtrarDeudoresYNavegar}/>;
  else if (scr === 'portal') screen = <PortalAlumnoScreen onNav={onNav} perfil={perfil}/>;
  else if (scr === 'alumnos') screen = <AlumnosScreen role={role} onNav={onNav} onSelect={onSelect} filtroInicial={filtroAlumnos}/>;
  else if (scr === 'form-alumno') screen = <FormAlumnoScreen onNav={onNav} alumno={selected}/>;
  else if (scr === 'ficha-alumno') screen = <FichaAlumnoScreen onNav={onNav} alumno={selected} role={role}/>;
  else if (scr === 'baja-alumno') screen = <BajaConfirmScreen onNav={onNav} tipo="alumno" item={selected}/>;
  else if (scr === 'estado-cuenta') screen = <EstadoCuentaScreen onNav={onNav} alumno={selected}/>;
  else if (scr === 'historial-asistencia') screen = <HistorialAsistenciaScreen onNav={onNav} alumno={selected}/>;
  else if (scr === 'clases') screen = <ClasesScreen role={role} onNav={onNav} onSelect={onSelect}/>;
  else if (scr === 'form-clase') screen = <FormClaseScreen onNav={onNav} clase={selected}/>;
  else if (scr === 'ficha-clase') screen = <FichaClaseScreen onNav={onNav} clase={selected} role={role}/>;
  else if (scr === 'baja-clase') screen = <BajaConfirmScreen onNav={onNav} tipo="clase" item={selected}/>;
  else if (scr === 'pagos') screen = <PagosScreen onNav={onNav}/>;
  else if (scr === 'registrar-pago') screen = <RegistrarPagoScreen onNav={onNav} alumno={selected}/>;
  else if (scr === 'promociones') screen = <PromocionesScreen onNav={onNav}/>;
  else if (scr === 'inasistencias') screen = <InasistenciasScreen onNav={onNav}/>;
  else if (scr === 'reemplazos') screen = <ReemplazosScreen onNav={onNav} role={role}/>;
  else if (scr === 'disponibilidad') screen = <DisponibilidadScreen onNav={onNav}/>;
  else if (scr === 'traza') screen = <TrazabilidadScreen onNav={onNav}/>;
  else if (scr === 'reportes') screen = <ReportesScreen/>;
  else if (scr === 'notificaciones') screen = <NotificacionesScreen role={role}/>;
  else if (scr === 'mi-plan') screen = <MiPlanScreen onNav={onNav} perfil={perfil}/>;
  else if (scr === 'mi-cuenta') screen = <MiCuentaScreen onNav={onNav} perfil={perfil}/>;
  else if (scr === 'mis-asistencias') screen = <MisAsistenciasScreen onNav={onNav} perfil={perfil}/>;
  else if (scr === 'decl-jurada') screen = <DeclJuradaScreen onNav={onNav}/>;
  else if (scr === 'cronograma') screen = <ClasesScreen role={role} onNav={onNav} onSelect={onSelect}/>;
  else if (scr === 'asistencia') screen = <RegistroAsistenciaScreen onNav={onNav} role={role}/>;
  else if (scr === 'asist-profes') screen = <AsistProfesoresScreen onNav={onNav}/>;
  else screen = <div className="scr active"><PageHeader title="EN" accent="CONSTRUCCIÓN" sub="Pantalla en desarrollo"/></div>;

  return (
    <div style={{minHeight:'100vh'}}>
      <Topbar role={role} perfil={perfil} onLogout={()=>{setRole(null); setScr('dashboard');}} onHome={()=>setScr(isAlumno?'portal':'dashboard')}/>
      <div className="app-body">
        <Sidebar role={role} active={scr} onNav={onNav}/>
        <div className="main">{screen}</div>
        {toastRegion}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
